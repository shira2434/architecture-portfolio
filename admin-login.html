<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>כניסת מנהל</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c8a96e;
      --gold2: #e8c98e;
      --dark: #080808;
      --panel: #111;
      --border: rgba(200,169,110,0.2);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated background */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(200,169,110,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200,169,110,0.06) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridMove 20s linear infinite;
    }

    @keyframes gridMove {
      0% { transform: perspective(500px) rotateX(10deg) translateY(0); }
      100% { transform: perspective(500px) rotateX(10deg) translateY(60px); }
    }

    .bg-glow {
      position: absolute;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200,169,110,0.08) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
      50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
    }

    .bg-lines {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .bg-lines span {
      position: absolute;
      width: 1px;
      background: linear-gradient(to bottom, transparent, var(--gold), transparent);
      animation: lineDown 6s linear infinite;
      opacity: 0;
    }

    @keyframes lineDown {
      0% { top: -100%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    /* Login panel */
    .login-wrap {
      position: relative;
      z-index: 1;
      width: 420px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .login-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px; height: 64px;
      border: 1px solid var(--gold);
      margin-bottom: 1.5rem;
      position: relative;
      animation: rotateBorder 8s linear infinite;
    }

    @keyframes rotateBorder {
      0% { box-shadow: 0 0 0 0 rgba(200,169,110,0.4); }
      50% { box-shadow: 0 0 20px 4px rgba(200,169,110,0.2); }
      100% { box-shadow: 0 0 0 0 rgba(200,169,110,0.4); }
    }

    .login-logo svg { width: 28px; height: 28px; fill: var(--gold); }

    .login-header h1 {
      color: #fff;
      font-size: 1.6rem;
      font-weight: 200;
      letter-spacing: 6px;
      margin-bottom: 0.4rem;
    }

    .login-header p {
      color: rgba(255,255,255,0.3);
      font-size: 0.75rem;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .login-panel {
      background: rgba(17,17,17,0.9);
      border: 1px solid var(--border);
      padding: 2.5rem;
      backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
    }

    .login-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .corner {
      position: absolute;
      width: 12px; height: 12px;
      border-color: var(--gold);
      border-style: solid;
    }
    .corner.tl { top: -1px; right: -1px; border-width: 1px 0 0 1px; }
    .corner.tr { top: -1px; left: -1px; border-width: 1px 1px 0 0; }
    .corner.bl { bottom: -1px; right: -1px; border-width: 0 0 1px 1px; }
    .corner.br { bottom: -1px; left: -1px; border-width: 0 1px 1px 0; }

    .field {
      margin-bottom: 1.5rem;
    }

    .field label {
      display: block;
      font-size: 0.7rem;
      letter-spacing: 2px;
      color: rgba(200,169,110,0.7);
      margin-bottom: 0.6rem;
      text-transform: uppercase;
    }

    .field-wrap {
      position: relative;
    }

    .field-wrap input {
      width: 100%;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      color: #fff;
      padding: 0.9rem 1rem 0.9rem 3rem;
      font-size: 0.9rem;
      font-family: inherit;
      direction: rtl;
      outline: none;
      transition: border-color 0.3s, background 0.3s;
      letter-spacing: 1px;
    }

    .field-wrap input:focus {
      border-color: var(--gold);
      background: rgba(200,169,110,0.04);
    }

    .field-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(200,169,110,0.5);
      font-size: 0.9rem;
      pointer-events: none;
    }

    .login-btn {
      width: 100%;
      padding: 1rem;
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-size: 0.85rem;
      letter-spacing: 3px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
      margin-top: 0.5rem;
    }

    .login-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gold);
      transform: translateX(101%);
      transition: transform 0.3s;
      z-index: 0;
    }

    .login-btn:hover::before { transform: translateX(0); }
    .login-btn:hover { color: #000; }
    .login-btn span { position: relative; z-index: 1; }

    .error-msg {
      color: #ff6b6b;
      font-size: 0.78rem;
      letter-spacing: 1px;
      text-align: center;
      margin-top: 1rem;
      min-height: 1.2rem;
      display: none;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: rgba(255,255,255,0.25);
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--gold); }

    .scan-line {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(200,169,110,0.4), transparent);
      animation: scan 3s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes scan {
      0% { top: 0; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="bg">
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>
    <div class="bg-lines" id="bgLines"></div>
  </div>

  <div class="login-wrap">
    <div class="login-header">
      <div class="login-logo">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22" fill="none" stroke="#c8a96e" stroke-width="1.5"/>
        </svg>
      </div>
      <h1>STUDIO</h1>
      <p>ממשק ניהול</p>
    </div>

    <div class="login-panel">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="scan-line"></div>

      <form id="loginForm">
        <div class="field">
          <label>שם משתמש</label>
          <div class="field-wrap">
            <span class="field-icon">◈</span>
            <input type="text" id="username" placeholder="admin" autocomplete="off" />
          </div>
        </div>
        <div class="field">
          <label>סיסמה</label>
          <div class="field-wrap">
            <span class="field-icon">◉</span>
            <input type="password" id="password" placeholder="••••••••" />
          </div>
        </div>
        <button type="submit" class="login-btn"><span>כניסה למערכת</span></button>
        <div class="error-msg" id="errorMsg">שם משתמש או סיסמה שגויים</div>
      </form>
    </div>

    <a href="index.html" class="back-link">← חזרה לאתר</a>
  </div>

  <script>
    // Animated lines
    const container = document.getElementById('bgLines');
    for (let i = 0; i < 8; i++) {
      const line = document.createElement('span');
      line.style.left = Math.random() * 100 + '%';
      line.style.height = (Math.random() * 30 + 20) + '%';
      line.style.animationDelay = Math.random() * 6 + 's';
      line.style.animationDuration = (Math.random() * 4 + 4) + 's';
      container.appendChild(line);
    }

    // Login
    const ADMIN_USER = 'admin';

    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const err = document.getElementById('errorMsg');
      const storedPass = localStorage.getItem('adminPass') || 'studio2025';

      if (u === ADMIN_USER && p === storedPass) {
        sessionStorage.setItem('adminAuth', 'true');
        window.location.href = 'admin.html';
      } else {
        err.style.display = 'block';
        document.querySelector('.login-panel').style.animation = 'shake 0.3s ease';
        setTimeout(() => err.style.display = 'none', 3000);
      }
    });
  </script>
</body>
</html>
